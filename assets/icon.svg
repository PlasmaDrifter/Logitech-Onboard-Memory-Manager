<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background: Deep charcoal / matte dark slate -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>

    <!-- Mouse Body: Understated titanium / matte dark graphite -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2c34"/>
      <stop offset="100%" stop-color="#1e2026"/>
    </linearGradient>

    <!-- Scroll wheel & buttons: Muted gunmetal steel -->
    <linearGradient id="metalAccents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4f5b"/>
      <stop offset="100%" stop-color="#323640"/>
    </linearGradient>

    <!-- Subtle Onboard Memory Chip: Low-saturation slate / steel -->
    <linearGradient id="chipMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383c46"/>
      <stop offset="100%" stop-color="#262930"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#panelBg)" stroke="#2b2e38" stroke-width="1.75"/>

  <!-- Subtle inner bevel ring -->
  <rect x="11" y="11" width="106" height="106" rx="23" fill="none" stroke="#22242c" stroke-width="1"/>

  <!-- Mouse Body (Matte finish) -->
  <path d="M 64 22 C 48 22, 36 37, 36 60 C 36 84, 46 106, 64 106 C 82 106, 92 84, 92 60 C 92 37, 80 22, 64 22 Z"
        fill="url(#chassisGrad)" stroke="#3e4350" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Subtle ergonomic center parting channel -->
  <line x1="64" y1="23" x2="64" y2="46" stroke="#2e323c" stroke-width="2"/>

  <!-- Scroll Wheel (Muted gunmetal) -->
  <rect x="58" y="30" width="12" height="24" rx="6" fill="url(#metalAccents)" stroke="#4b515f" stroke-width="1.25"/>
  <!-- Wheel grip grooves -->
  <line x1="60" y1="36" x2="68" y2="36" stroke="#252830" stroke-width="1"/>
  <line x1="60" y1="42" x2="68" y2="42" stroke="#252830" stroke-width="1"/>
  <line x1="60" y1="48" x2="68" y2="48" stroke="#252830" stroke-width="1"/>

  <!-- Thumb Rest / Side Flare -->
  <path d="M 36 50 C 31 52, 29 58, 29 66 C 29 74, 32 80, 36 82" 
        fill="none" stroke="#4a505f" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Side Buttons (G7 / G8 profile) -->
  <path d="M 45 32 L 48 44" stroke="#4a505f" stroke-width="2.25" stroke-linecap="round"/>
  <path d="M 42 36 L 45 48" stroke="#383c48" stroke-width="2" stroke-linecap="round"/>

  <!-- Onboard Memory Module Emblem (Center Palm Area) -->
  <rect x="53" y="69" width="22" height="18" rx="3.5" fill="url(#chipMetal)" stroke="#505666" stroke-width="1.5"/>
  
  <!-- Subtle Integrated Core Point -->
  <circle cx="64" cy="78" r="2.5" fill="#717a8c"/>

  <!-- Discrete Chip Traces / Pins -->
  <line x1="49" y1="73" x2="53" y2="73" stroke="#505666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="78" x2="53" y2="78" stroke="#505666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="83" x2="53" y2="83" stroke="#505666" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="75" y1="73" x2="79" y2="73" stroke="#505666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="78" x2="79" y2="78" stroke="#505666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="83" x2="79" y2="83" stroke="#505666" stroke-width="1.5" stroke-linecap="round"/>
</svg>
