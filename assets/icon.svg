<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Mouse body silhouette -->
  <path d="M 64 24 C 48 24, 38 38, 38 60 C 38 82, 46 104, 64 104 C 82 104, 90 82, 90 60 C 90 38, 80 24, 64 24 Z" 
        fill="none" stroke="#64748b" stroke-width="4" stroke-linejoin="round"/>

  <!-- Split line & Scroll wheel -->
  <line x1="64" y1="24" x2="64" y2="44" stroke="#64748b" stroke-width="3"/>
  <rect x="58" y="32" width="12" height="24" rx="6" fill="url(#accentGrad)"/>

  <!-- Thumb / side buttons accent -->
  <path d="M 36 48 C 33 48, 30 52, 30 58 L 30 72 C 30 78, 33 82, 36 82" 
        fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Onboard Memory Chip / Circuit emblem -->
  <rect x="52" y="68" width="24" height="20" rx="3" fill="url(#chipGrad)" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="64" cy="78" r="3" fill="#ffffff"/>
  <!-- Chip pins -->
  <line x1="48" y1="72" x2="52" y2="72" stroke="#60a5fa" stroke-width="2"/>
  <line x1="48" y1="78" x2="52" y2="78" stroke="#60a5fa" stroke-width="2"/>
  <line x1="48" y1="84" x2="52" y2="84" stroke="#60a5fa" stroke-width="2"/>
  <line x1="76" y1="72" x2="80" y2="72" stroke="#60a5fa" stroke-width="2"/>
  <line x1="76" y1="78" x2="80" y2="78" stroke="#60a5fa" stroke-width="2"/>
  <line x1="76" y1="84" x2="80" y2="84" stroke="#60a5fa" stroke-width="2"/>
</svg>
